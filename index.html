<!DOCTYPE html>
<html>
<head>
  <title>Peminjaman Loker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial; text-align: center; padding: 20px; }
    input { padding: 10px; width: 90%; margin: 10px; }
    button { padding: 12px; width: 90%; margin: 5px; border: none; font-size: 16px; color: white; }
    .btn { background: green; }
    .kembali { background: orange; }
    .disable { background: gray !important; }
  </style>
</head>
<body>

<h2>Peminjaman Loker</h2>

<h3 id="infoLoker"></h3>
<h3 id="statusLoker"></h3>

<input type="text" id="nik" placeholder="Masukkan NIK" onkeyup="cekNIK()">
<input type="text" id="nama" placeholder="Nama otomatis" readonly>

<button id="btnProses" class="btn" onclick="proses()">PROSES</button>

<h3 id="hasil"></h3>

<script>
const urlScript = "https://script.google.com/macros/s/AKfycbyqpkR-BVDDvUfKqcanfvEkk_EKuxJ11vodjAD-bamBzCs6KrrGsueFgeanjR4GbWsQ/exec";

// ambil parameter
const params = new URLSearchParams(window.location.search);
const loker = params.get("loker"); // ada saat PINJAM
const mode = params.get("mode") || "PINJAM"; // default PINJAM

const btn = document.getElementById("btnProses");

// ubah tombol kalau mode kembali
if (mode === "KEMBALI") {
  btn.innerText = "KEMBALIKAN";
  btn.classList.remove("btn");
  btn.classList.add("kembali");
}

// =====================
// LOAD STATUS (hanya PINJAM)
// =====================

  if (!loker || mode !== "PINJAM") return;

  return;
}

        btn.classList.add("disable");
      }
    });

// =====================
// CEK NIK
// =====================
function cekNIK() {
  const nik = document.getElementById("nik").value;

  if (nik.length < 3) return;

  document.getElementById("nama").value = "Mencari...";

  fetch(urlScript + "?action=ceknik&nik=" + nik)
    .then(res => res.text())
    .then(nama => {
      document.getElementById("nama").value = nama;
    });
}

// =====================
// PROSES
// =====================
function proses() {
  const nik = document.getElementById("nik").value;
  const nama = document.getElementById("nama").value;

  if (!nik || !nama || nama === "Mencari...") {
    alert("Isi data dengan benar!");
    return;
  }

  fetch(urlScript, {
    method: "POST",
    body: JSON.stringify({
      nik: nik,
      nama: nama,
      loker: loker, // kosong saat KEMBALI global
      status: mode
    })
  })
  .then(res => res.text())
  .then(res => {

    // HANDLE ERROR
    if (res.startsWith("ERROR")) {
      alert(res);
      return;
    }

    // tampilkan hasil utama
    document.getElementById("hasil").innerText =
      "Berhasil " + mode;

    // 🔥 tampilkan nomor loker HANYA setelah sukses
    if (mode === "PINJAM" && loker) {
      document.getElementById("infoLoker").innerText =
        "✔ Loker " + loker + " berhasil dipinjam";
    }

  document.getElementById("infoLoker").innerText =
    "✔ Loker " + res.loker + " berhasil dikembalikan";
}
    }

    // reset form
    document.getElementById("nik").value = "";
    document.getElementById("nama").value = "";

    loadStatus();
  });
}

// load awal
loadStatus();
</script>

</body>
</html>

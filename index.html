<!DOCTYPE html>
<html>
<head>
  <title>Peminjaman Kunci Loker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial; text-align: center; padding: 20px; }
    input { padding: 10px; width: 90%; margin: 10px; }
    button { padding: 12px; width: 90%; font-size: 16px; color: white; background: green; border: none; }
  </style>
</head>
<body>

<h2 id="judul"></h2>

<h3 id="info"></h3>

<input id="nik" placeholder="Masukkan NIK" onkeyup="cekNIK()">
<input id="nama" placeholder="Nama otomatis" readonly>

<button onclick="proses()">PROSES</button>

<h3 id="hasil"></h3>

<script>
const url = "https://script.google.com/macros/s/AKfycbxZiPYonWOXiaqhIPMUOiJmsgUZRMq55ffRR_ARe4szqQJVhmEuUyXtozlN6_KxG30Q/exec";

const params = new URLSearchParams(window.location.search);
const loker = params.get("loker");
const mode = params.get("mode") || "PINJAM";
const judul = document.getElementById("judul");

if (mode === "KEMBALI") {
  judul.innerText = "Pengembalian Kunci Loker";
} else {
  judul.innerText = "Peminjaman kunci Loker";
}
document.getElementById("info").innerText = "";

// ===== CEK NIK =====
function cekNIK() {
  const nik = document.getElementById("nik").value;
  if (nik.length < 3) return;

  fetch(url + "?action=ceknik&nik=" + nik)
    .then(r => r.text())
    .then(n => document.getElementById("nama").value = n);
}

// ===== PROSES =====
function proses() {
  const nik = document.getElementById("nik").value;
  const nama = document.getElementById("nama").value;

  if (!nik || !nama) {
    alert("Isi data!");
    return;
  }

  fetch(url, {
    method: "POST",
    body: JSON.stringify({
      nik: nik,
      nama: nama,
      loker: loker,
      status: mode
    })
  })
  .then(r => r.text())
  .then(txt => {
    console.log(txt);

    let res;
    try {
      res = JSON.parse(txt);
    } catch {
      alert("ERROR SERVER:\n" + txt);
      return;
    }

    if (res.status !== "OK") {
      alert(res.message);
      return;
    }

    document.getElementById("hasil").innerText =
      "✔ Loker " + res.loker + " berhasil " + res.mode;
    document.getElementById("info").innerText =
     "✔ Loker " + res.loker + " berhasil " + res.mode;
  });
}
</script>

</body>
</html>

<script>
const urlScript = "https://script.google.com/macros/s/AKfycbxZiPYonWOXiaqhIPMUOiJmsgUZRMq55ffRR_ARe4szqQJVhmEuUyXtozlN6_KxG30Q/exec";

// tunggu DOM siap
window.onload = function () {

  const params = new URLSearchParams(window.location.search);
  const loker = params.get("loker");
  const mode = params.get("mode") || "PINJAM";

  const btn = document.getElementById("btnProses");

  // mode kembali
  if (mode === "KEMBALI") {
    btn.innerText = "KEMBALIKAN";
    btn.classList.remove("btn");
    btn.classList.add("kembali");
  }

  // =====================
  // LOAD STATUS
  // =====================
  function loadStatus() {
    if (!loker || mode !== "PINJAM") return;

    fetch(urlScript + "?action=cekloker&loker=" + loker)
      .then(res => res.text())
      .then(status => {
        document.getElementById("statusLoker").innerText =
          "Status: " + status;

        if (status === "PINJAM") {
          btn.disabled = true;
          btn.classList.add("disable");
        }
      });
  }

  // =====================
  // CEK NIK
  // =====================
  window.cekNIK = function () {
    const nik = document.getElementById("nik").value;

    if (nik.length < 3) return;

    document.getElementById("nama").value = "Mencari...";

    fetch(urlScript + "?action=ceknik&nik=" + nik)
      .then(res => res.text())
      .then(nama => {
        document.getElementById("nama").value = nama;
      });
  }

  // =====================
  // PROSES
  // =====================
  window.proses = function () {
    const nik = document.getElementById("nik").value;
    const nama = document.getElementById("nama").value;

    if (!nik || !nama || nama === "Mencari...") {
      alert("Isi data dengan benar!");
      return;
    }

    fetch(urlScript, {
      method: "POST",
      body: JSON.stringify({
        nik: nik,
        nama: nama,
        loker: loker,
        status: mode
      })
    })
    .then(res => res.text())
    .then(res => {

      console.log("RESPONSE:", res);

      let data;
      try {
        data = JSON.parse(res);
      } catch (e) {
        alert("Response bukan JSON:\n" + res);
        return;
      }

      if (data.status !== "OK") {
        alert(data.message || "Terjadi kesalahan");
        return;
      }

      document.getElementById("hasil").innerText =
        "Berhasil " + data.mode;

      // PINJAM
      if (data.mode === "PINJAM") {
        document.getElementById("infoLoker").innerText =
          "✔ Loker " + data.loker + " berhasil dipinjam";
      }

      // KEMBALI
      if (data.mode === "KEMBALI") {
        document.getElementById("infoLoker").innerText =
          "✔ Loker " + data.loker + " berhasil dikembalikan";
      }

      document.getElementById("nik").value = "";
      document.getElementById("nama").value = "";

      loadStatus();
    });
  }

  // load awal
  loadStatus();
};
</script>

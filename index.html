<!DOCTYPE html>
<html>
<head>
  <title>Peminjaman Loker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial; text-align: center; padding: 20px; }
    input { padding: 10px; width: 90%; margin: 10px; }
    button { padding: 12px; width: 90%; margin: 5px; border: none; font-size: 16px; color: white; }
    #pinjam { background: green; }
    #kembali { background: orange; }
    .disable { background: gray !important; }
  </style>
</head>
<body>

<h2>Peminjaman Loker</h2>

<h3 id="statusLoker"></h3>

<input type="text" id="nik" placeholder="Masukkan NIK" onkeyup="cekNIK()">
<input type="text" id="nama" placeholder="Nama otomatis" readonly>

<br>

<button id="pinjam" onclick="proses()">PROSES</button>

<h3 id="hasil"></h3>

<script>
const urlScript = "https://script.google.com/macros/s/AKfycbyqpkR-BVDDvUfKqcanfvEkk_EKuxJ11vodjAD-bamBzCs6KrrGsueFgeanjR4GbWsQ/exec";

// ambil parameter
const params = new URLSearchParams(window.location.search);
const loker = params.get("loker");
const mode = params.get("mode") || "PINJAM";

  if (loker && mode === "PINJAM") {
  document.getElementById("infoLoker").innerText =
    "Anda akan meminjam loker " + loker;
}

// ubah tampilan tombol sesuai mode
const btn = document.getElementById("pinjam");

if (mode === "KEMBALI") {
  btn.innerText = "KEMBALIKAN";
  btn.style.background = "orange";
}

// =====================
// LOAD STATUS LOKER (hanya untuk PINJAM)
// =====================
function loadStatus() {
  if (!loker) return;

  fetch(urlScript + "?action=cekloker&loker=" + loker)
    .then(res => res.text())
    .then(status => {
      document.getElementById("statusLoker").innerText =
        "Status Loker: " + status;

      // hanya berlaku di mode PINJAM
      if (mode === "PINJAM") {
        if (status === "PINJAM") {
          btn.disabled = true;
          btn.classList.add("disable");
        } else {
          btn.disabled = false;
          btn.classList.remove("disable");
        }
      }
    });
}

// =====================
// CEK NIK
// =====================
function cekNIK() {
  const nik = document.getElementById("nik").value;

  if (nik.length < 3) return;

  document.getElementById("nama").value = "Mencari...";

  fetch(urlScript + "?action=ceknik&nik=" + nik)
    .then(res => res.text())
    .then(nama => {
      document.getElementById("nama").value = nama;
    });
}

// =====================
// PROSES (PINJAM / KEMBALI)
// =====================
function proses() {
  const nik = document.getElementById("nik").value;
  const nama = document.getElementById("nama").value;

  if (!nik || !nama || nama === "Mencari...") {
    alert("Isi data dengan benar!");
    return;
  }

  fetch(urlScript, {
    method: "POST",
    body: JSON.stringify({
      nik: nik,
      nama: nama,
      loker: loker, // kosong saat mode kembali global
      status: mode
    })
  })
  .then(res => res.text())
  .then(res => {

    if (res === "ERROR:TIDAK_ADA_PINJAMAN") {
      alert("Anda tidak memiliki loker yang dipinjam!");
      return;
    }

    if (res === "ERROR:BUKAN_PEMINJAM") {
      alert("Bukan peminjam!");
      return;
    }

    if (res === "ERROR:LOKER_DIPAKAI") {
      alert("Loker sedang dipakai!");
      return;
    }

    if (res === "ERROR:BELUM_DIPINJAM") {
      alert("Loker belum dipinjam!");
      return;
    }

    document.getElementById("hasil").innerText =
      "Berhasil " + mode;

    document.getElementById("nik").value = "";
    document.getElementById("nama").value = "";

    loadStatus();
  });
}

// load awal
loadStatus();
</script>

</body>
</html>

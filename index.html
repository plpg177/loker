<!DOCTYPE html>
<html>
<head>
  <title>Peminjaman Loker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial; text-align: center; padding: 20px; }
    input { padding: 10px; width: 90%; margin: 10px; }
    button { padding: 12px; width: 45%; margin: 5px; border: none; font-size: 16px; color: white; }
    #pinjam { background: green; }
    #kembali { background: orange; }
    .disable { background: gray !important; }
  </style>
</head>
<body>

<h2>Peminjaman Loker</h2>

<h3 id="statusLoker"></h3>

<input type="text" id="nik" placeholder="Masukkan NIK" onkeyup="cekNIK()">
<input type="text" id="nama" placeholder="Nama otomatis" readonly>

<br>

<button id="pinjam" onclick="proses('PINJAM')">PINJAM</button>

<h3 id="hasil"></h3>

<script>
const urlScript = "https://script.google.com/macros/s/AKfycbyqpkR-BVDDvUfKqcanfvEkk_EKuxJ11vodjAD-bamBzCs6KrrGsueFgeanjR4GbWsQ/exec";

// ambil dari QR
const params = new URLSearchParams(window.location.search);
const loker = params.get("loker");
const mode = params.get("mode") || "PINJAM";
if (mode === "KEMBALI") {
  document.getElementById("pinjam").style.display = "none";
}  

// =====================
// CEK STATUS LOKER SAAT LOAD
// =====================
function loadStatus() {
  fetch(urlScript + "?action=cekloker&loker=" + loker)
    .then(res => res.text())
    .then(status => {
      document.getElementById("statusLoker").innerText =
        "Status Loker: " + status;

      const btnPinjam = document.getElementById("pinjam");
      const btnKembali = document.getElementById("kembali");

      if (status === "PINJAM") {
        btnPinjam.disabled = true;
        btnPinjam.classList.add("disable");

        btnKembali.disabled = false;
        btnKembali.classList.remove("disable");
      } else {
        btnPinjam.disabled = false;
        btnPinjam.classList.remove("disable");

        btnKembali.disabled = true;
        btnKembali.classList.add("disable");
      }
    });
}

// =====================
// CEK NIK
// =====================
function cekNIK() {
  const nik = document.getElementById("nik").value;

  if (nik.length < 3) return;

  document.getElementById("nama").value = "Mencari...";

  fetch(urlScript + "?action=ceknik&nik=" + nik)
    .then(res => res.text())
    .then(nama => {
      document.getElementById("nama").value = nama;
    });
}

// =====================
// PROSES PINJAM / KEMBALI
// =====================
function proses(mode) {
  const nik = document.getElementById("nik").value;
  const nama = document.getElementById("nama").value;

  if (!nik || !nama || nama === "Mencari...") {
    alert("Isi data dengan benar!");
    return;
  }

  fetch(urlScript, {
    method: "POST",
    body: JSON.stringify({
      nik: nik,
      nama: nama,
      loker: loker, // kosong kalau kembali global
      status: mode
    })
  })
  .then(res => res.text())
  .then(res => {

    if (res === "ERROR:TIDAK_ADA_PINJAMAN") {
      alert("Anda tidak memiliki loker yang dipinjam!");
      return;
    }

    if (res === "ERROR:BUKAN_PEMINJAM") {
      alert("Bukan peminjam!");
      return;
    }

    document.getElementById("hasil").innerText =
      "Berhasil " + mode;

    document.getElementById("nik").value = "";
    document.getElementById("nama").value = "";
  });
}

function kirimData(mode) {
  fetch(urlScript, {
    method: "POST",
    body: JSON.stringify({
      nik: nik,
      nama: nama,
      loker: loker,
      status: mode
    })
  })
  .then(res => res.text())
  .then(res => {
    if (res === "ERROR:SUDAH_DIPAKAI") {
      alert("QR sudah digunakan!");
      return;
    }

    document.getElementById("hasil").innerText =
      "Berhasil " + mode + " loker " + loker;

    loadStatus();
  });
}
    
  }

  fetch(urlScript, {
    method: "POST",
    body: JSON.stringify({
      nik: nik,
      nama: nama,
      loker: loker,
      status: mode
    })
  })
  .then(res => res.text())
  .then(() => {
    document.getElementById("hasil").innerText =
      "Berhasil " + mode + " loker " + loker;

    document.getElementById("nik").value = "";
    document.getElementById("nama").value = "";

    loadStatus(); // refresh status tombol
    if (status === "PINJAM") {
  btnPinjam.disabled = true;
  btnPinjam.classList.add("disable");

  btnKembali.disabled = false;
  btnKembali.classList.remove("disable");
}
  });
}

// load awal
loadStatus();
</script>

</body>
</html>

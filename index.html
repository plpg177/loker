<!DOCTYPE html>
<html>
<head>
  <title>Peminjaman Loker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 20px;
    }
    input {
      padding: 10px;
      width: 90%;
      margin: 10px;
    }
    button {
      padding: 12px;
      width: 95%;
      background: green;
      color: white;
      border: none;
      font-size: 16px;
    }
  </style>
</head>
<body>

<h2>Peminjaman Loker</h2>

<h3 id="info" style="display:none;"></h3>

<input type="text" id="nik" placeholder="Masukkan NIK" onkeyup="cekNIK()">
<input type="text" id="nama" placeholder="Nama otomatis" readonly>

<button onclick="kirim()">KIRIM</button>

<h3 id="hasil"></h3>

<script>
const urlScript = "https://script.google.com/macros/s/AKfycbzU-XyGs5XT7JuU5CTYehQwFr5Chk3vwENZNuEVNNbZKDsP6ftFGezRIZVCmIqfpBFX/exec";

// ambil parameter dari QR
const params = new URLSearchParams(window.location.search);
const loker = params.get("loker");
const mode = params.get("mode") || "PINJAM";

// tampilkan info loker
document.getElementById("info").innerText =
  "Loker: " + loker + " (" + mode + ")";

// =====================
// KIRIM DATA
// =====================
function kirim() {
  const nik = document.getElementById("nik").value;
  const nama = document.getElementById("nama").value;

  if (!nik) {
    alert("NIK harus diisi!");
    return;
  }

  if (!nama || nama === "Mencari...") {
    alert("Tunggu, data masih diproses atau NIK tidak ditemukan!");
    return;
  }

  // 🔴 CEK STATUS LOKER DULU
  fetch(urlScript + "?action=cekloker&loker=" + loker)
    .then(res => res.text())
    .then(status => {

      if (status === "PINJAM") {
        alert("Loker sedang dipinjam! Tidak bisa dipinjam lagi.");
        return;
      }

      // ✅ kalau aman → kirim data
      fetch(urlScript, {
        method: "POST",
        body: JSON.stringify({
          nik: nik,
          nama: nama,
          loker: loker,
          status: mode
        })
      })
      .then(res => res.text())
      .then(() => {
        document.getElementById("hasil").innerText =
          "Berhasil " + mode + " loker " + loker;

        document.getElementById("nik").value = "";
        document.getElementById("nama").value = "";
      });

    });
}

// =====================
// CEK NIK
// =====================
function cekNIK() {
  const nik = document.getElementById("nik").value;

  if (nik.length < 3) return;

  document.getElementById("nama").value = "Mencari...";

  fetch(urlScript + "?action=ceknik&nik=" + nik)
    .then(res => res.text())
    .then(nama => {
      if (nama.trim() === "") {
        document.getElementById("nama").value = "";
      } else {
        document.getElementById("nama").value = nama;
      }
    });
}
</script>

</body>
</html>
